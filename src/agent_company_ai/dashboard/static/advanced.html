<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Control — Agent Company AI</title>
  <link rel="stylesheet" href="/advanced.css" />
</head>
<body>
  <div class="mc">

    <header class="mc-header">
      <div class="mc-title">
        <span class="mc-logo">🤖</span>
        <div>
          <h1 id="companyName">Mission Control</h1>
          <p class="mc-sub">Talk to your AI team — out loud</p>
        </div>
      </div>
      <div class="mc-header-actions">
        <span id="voiceState" class="voice-state">connecting…</span>
        <a href="/" class="btn btn-ghost">← Main dashboard</a>
      </div>
    </header>

    <section class="agent-deck" id="agentDeck">
    </section>

    <main class="mc-main">
      <section class="chat-panel">
        <div class="chat-log" id="chatLog">
          <div class="chat-welcome">
            <p>👋 Pick a teammate on the left and start talking.</p>
            <p class="hint">Click the 🎤 mic and speak, or just type. Agents use their tools, reply, and can <em>talk back</em> — toggle hands-free to keep the conversation rolling.</p>
          </div>
        </div>
      </section>

      <footer class="composer">
        <div class="composer-row">
          <button id="micBtn" class="mic-btn" title="Toggle microphone (hold your click to talk)">🎤</button>
          <input id="textInput" type="text" placeholder="Type a message… or hit the mic and talk" autocomplete="off" />
          <button id="sendBtn" class="btn btn-primary">Send</button>
          <button id="stopBtn" class="btn btn-danger" title="Stop speaking / cancel">⏹</button>
        </div>
        <div class="composer-row settings">
          <div class="mode-switch" title="Direct = talk to one agent · Group = message the team">
            <button type="button" id="modeDirect" class="mode-btn active">Direct</button>
            <button type="button" id="modeGroup" class="mode-btn">Group</button>
            <button type="button" id="groupAll" class="mode-btn" style="display:none" title="Include all agents again">All</button>
          </div>
          <label class="toggle"><input type="checkbox" id="handsfree" /> Hands-free (auto-listen after they reply)</label>
          <label>Voice
            <select id="voiceSelect" title="Voice the agents use to speak"></select>
          </label>
          <label>Speed
            <input type="range" id="rateRange" min="0.6" max="2.0" step="0.05" value="1.7" />
          </label>
          <span class="status" id="statusLine">Ready.</span>
        </div>
      </footer>
    </main>

  </div>
  <script src="/advanced.js"></script>
</body>
</html>
